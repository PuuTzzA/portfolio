<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sdf-ui.css">
    <title>Putzer Thomas</title>
</head>

<body>
    <sdf-light class="light" id="light-1" data-render-layers="1"></sdf-light>
    <sdf-light class="light" id="light-2" data-render-layers="1"></sdf-light>
    <!-- this lights is only for the background to pass color info -->
    <sdf-light class="light" id="light-3" data-render-layers="2"></sdf-light>
    <sdf-light class="light" id="light-4" data-render-layers="2"></sdf-light>
    <!-- this lights is only for the background to pass color info -->

    <div id="fps">10fps</div>


    <canvas id="sdf-canvas" class="middle-sizing"></canvas>
    <div id="content-stencil-canvas"></div>

    <sdf-sphere id="cursor" data-layer-index="4" data-render-layers="0"></sdf-sphere>

    <div class="appearance-settings-container">
        <t-icon-button id="toggle-header" content="close"></t-icon-button>
        <t-icon-button id="toggle-3d" content="3d_2"></t-icon-button>
        <t-icon-button id="toggle-theme" content="light_mode"></t-icon-button>
    </div>

    <div class="header">
        <nav id="header-link-container" class="focusable show-header">
            <t-sdf-push-button class="header-button" content="About" link-href="#about"
                sdf-element-class="header-link-sdf-box" sdf-negative-class="header-link-sdf-box"
                data-render-layers="1"></t-sdf-push-button>
            <t-sdf-push-button class="header-button" content="Timeline" link-href="#timeline"
                sdf-element-class="header-link-sdf-box" sdf-negative-class="header-link-sdf-box"
                data-render-layers="1"></t-sdf-push-button>
            <t-sdf-push-button class="header-button" content="Projects" link-href="#projects"
                sdf-element-class="header-link-sdf-box" sdf-negative-class="header-link-sdf-box"
                data-render-layers="1"></t-sdf-push-button>
            <t-sdf-push-button class="header-button" content="Contact" link-href="#contact"
                sdf-element-class="header-link-sdf-box" sdf-negative-class="header-link-sdf-box"
                data-render-layers="1"></t-sdf-push-button>
        </nav>
    </div>

    <sdf-box id="page-content-container" class="" data-layer-index="2" data-render-layers="1">
        <div id="about" class="section-container about-container">
            <div id="title-text-container">
                <sdf-text id="title-text" data-layer-index="1" data-render-layers="1">thomas putzer</sdf-text>
                <div id="title-text-twist-target" data-active="true"></div>
            </div>
            <div class="about-section">
                <div class="about-section-info">
                    <div class="main-info text">M.Sc. Student of Informatics: Games Engineering</div>
                    <div class="personal-information-container text-muted">
                        <t-span-with-icon title="" icon="location_on" content="Munich, Germany"
                            space-between="true"></t-span-with-icon>
                        <t-span-with-icon title="" icon="bookmark" content="Computer Simulations, Graphics & Vision"
                            space-between="false"></t-span-with-icon>
                    </div>
                </div>
                <div class="about-section-links">
                    <a class="icon-link cv-icon" aria-label="Download CV"
                        href="./assets/documents/Putzer_Thomas_CV_2026.pdf" download="Putzer_Thomas_CV.pdf"></a>
                    <a class="icon-link mail-icon" aria-label="E-Mail" href="mailto:putzerthomas55@gmail.com"></a>
                    <!-- <div class="icon-link youtube-icon" aria-label="GitHub"></div> -->
                </div>
            </div>
        </div>

        <div class="section-container">
            <div id="timeline" class="section-container-spacer"></div>

            <div id="timeline-header">
                <t-sdf-push-button id="timeline-education-button" content="Education" link-href=""
                    sdf-element-class="timeline-header-items" sdf-negative-class="timeline-header-items"
                    data-render-layers="1"></t-sdf-push-button>
                <t-sdf-push-button id="timeline-experience-button" content="Experience" link-href=""
                    sdf-element-class="timeline-header-items" sdf-negative-class="timeline-header-items"
                    data-render-layers="1"></t-sdf-push-button>
            </div>
            <div class="timeline-content-container">
                <div id="timeline-content-education" class="timeline-content">
                    <div class="timeline-line"></div>
                    <t-timeline-entry title="Technical University of Munich" location="Munich, Germany" from-year="2022"
                        from-month="Sep." to-year="now" to-month="" content="M.Sc. Informatics: Games Engineering
                        <br>Current Grade: 1.2 (US GPA equivalent: ~4.0/4.0)"></t-timeline-entry>
                    <t-timeline-entry title="Tsinghua University" location="Beijing, China" from-year="2026"
                        from-month="Sep." to-year="2027" to-month="Jan."
                        content="Exchange Semester at Tsinghua University."></t-timeline-entry>
                    <t-timeline-entry title="Technical University of Munich" location="Munich, Germany" from-year="2022"
                        from-month="Sep." to-year="2025" to-month="Oct."
                        content="B.Sc. Informatics: Games Engineering
                        <br>Grade: 1.3 (US GPA equivalent: ∼4.0/4.0)
                        <br>Thesis: Higher-Order Mass- and Momentum-Conserving Advection for Fluid Simulations with Large Time Steps"></t-timeline-entry>
                    <t-timeline-entry title="Seoul National University" location="Seoul, South Korea" from-year="2024"
                        from-month="Sep." to-year="2025" to-month="Jan."
                        content="Exchange Semester at Seoul National University."></t-timeline-entry>
                    <t-timeline-entry title="Technical Secondary School Bruneck" location="Bruneck, Italy"
                        from-year="2017" from-month="Sep." to-year="2022" to-month="Jun."
                        content="Maturità (High School Diploma): 100/100 Points
                        <br>Branch: Electronics and Electrical Engineering, with the focus on Automation."></t-timeline-entry>
                </div>
                <div id="timeline-content-experience" class="timeline-content">
                    <div class="timeline-line"></div>
                    <t-timeline-entry title="Working Student: Vector Informatik" location="Munich, Germany"
                        from-year="2025" from-month="Nov." to-year="2026" to-month="Aug."
                        content="- Worked on an interactive editor for OpenDrive files built with Unity.
                        <br>- Developed an import feature for GPX, GeoJSON, and CSV formats to convert waypoints into smooth splines.
                        <br>- Developed a feature to connect two roads or lanes via G2-continuous splines using clothoids and arcs."></t-timeline-entry>
                    <t-timeline-entry title="Substitute Teacher: Technical Secondary School Bruneck"
                        location="Bruneck, Italy" from-year="" from-month="" to-year="2024" to-month="Arp."
                        content="- Taught automation (WinSPS/Step7, Arduino, Python, and web technologies (HTML/CSS/JavaScript))."></t-timeline-entry>
                    <t-timeline-entry title="Substitute Teacher: Technical Secondary School Bruneck"
                        location="Bruneck, Italy" from-year="" from-month="" to-year="2023" to-month="Mar."
                        content="- Taught electrical engineering and electronics (electric motors and transistors)."></t-timeline-entry>
                </div>
            </div>
        </div>

        <div style="height: 100rem;"></div>
    </sdf-box>

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:wght@400" rel="stylesheet" />

    <script src="js/custom-elements.js" type="module"></script>
    <script src="sdf-ui/src/scripts/sdf-elements.js" type="module"></script>
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/adaptive.js"></script>
</body>

</html>
